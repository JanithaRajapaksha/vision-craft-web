services:
  postgres:
    image: postgres:16-alpine
    container_name: visioncraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visioncraft_admin
      POSTGRES_PASSWORD: visioncraft_secure_pass
      POSTGRES_DB: visioncraft_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioncraft_admin -d visioncraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visioncraft_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: visioncraft_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://visioncraft_admin:visioncraft_secure_pass@postgres:5432/visioncraft_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/storage_data
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: visioncraft_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "slicing,pdf,default"]
    environment:
      DATABASE_URL: postgresql+asyncpg://visioncraft_admin:visioncraft_secure_pass@postgres:5432/visioncraft_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/storage_data
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: visioncraft_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
